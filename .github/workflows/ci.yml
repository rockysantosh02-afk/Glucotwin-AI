name: GlucoTwin AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Model Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test_secret_key_for_ci_pipeline_verification_32chars
        run: |
          pytest -v

      - name: Run model quantitative benchmark evaluation
        env:
          ENVIRONMENT: testing
        run: |
          python scripts/evaluate_models.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  security-audit:
    name: Secrets & Repository Integrity Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify no .env secrets committed
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file found in repository!"
            exit 1
          fi
          echo ".env is not committed. Verified."
