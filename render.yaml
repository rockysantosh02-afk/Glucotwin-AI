# ==============================================================================
# GlucoTwin AI - Render Infrastructure Blueprint
# Multi-Service Architecture: Managed PostgreSQL 16 + FastAPI Backend + Vite SPA
# ==============================================================================

databases:
  - name: glucotwin-db
    databaseName: glucotwin
    user: glucotwin_user
    plan: starter
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # Service 1: Python FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: glucotwin-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glucotwin-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: '["https://glucotwin-frontend.onrender.com"]'
      - key: ALLOWED_HOSTS
        value: '["glucotwin-backend.onrender.com"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  # ----------------------------------------------------------------------------
  # Service 2: React / Vite Static Frontend Site
  # ----------------------------------------------------------------------------
  - type: static
    name: glucotwin-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://glucotwin-backend.onrender.com
